name: publish
# Shared release implementation: reviewed npm OIDC artifact publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.4)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Reusable workflows CANNOT escalate a caller-level permission block. Grant
    # `id-token: write` here at the reusable-call job level so npm OIDC can mint the
    # publish token. The shared workflow narrows the build job to `contents: read`.
    permissions:
      contents: read
      id-token: write
    uses: img2threejs/ci-workflows/.github/workflows/npm-publish.yml@7ef63107b39f77df3a11062a1a0a2245f500921c
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      tag-prefix: 'v'
      version-file: package.json
      package-directory: '.'
      node-version: '24'
      python-version: '3.12'
      test-command: npm test
      provenance: 'true'